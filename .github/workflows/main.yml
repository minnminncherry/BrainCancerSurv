name: BrainCancerSurv CI Pipeline

on:
  push:
    branches: [v1.0, master, main]
  pull_request:
    branches: [v1.0, master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '2'
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
      TENSORBOARD_LOG_DIR: ${{ runner.temp }}/tensorboard
      RESULT_DIR: ${{ runner.temp }}/results
      CUDA_VISIBLE_DEVICES: ''
      TF_CPP_MIN_LOG_LEVEL: '3'

    strategy:
      matrix:
        python-version: ['3.10']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install 'pytest>=8,<9'
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q main.py model dataset utils clean_dataset script tests

      - name: Check shell script syntax
        run: |
          for script in script/*.sh; do
            sh -n "$script"
          done

      - name: Check CPU PyTorch installation
        run: |
          python -c "import torch, torchvision, torchaudio; assert torch.version.cuda is None; print('CPU PyTorch:', torch.__version__)"

      - name: Run model tests
        # The DICOM diagnostic script requires local files and is not a pytest test.
        run: python -m pytest tests -q --junitxml=test-results.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-python-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore
